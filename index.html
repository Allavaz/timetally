<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Time Tally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column, two time blocks stacked, total pinned beneath like a timesheet footer */
:root {
  --bg: #f3f5f6;
  --card: #ffffff;
  --fg: #1b2428;
  --muted: #5d6b72;
  --line: #d6dde0;
  --accent: #0f7a6c;
  --accent-soft: #e2f1ee;
  --display: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121719; --card: #1b2225; --fg: #e6ecee; --muted: #93a2a8;
    --line: #2c373b; --accent: #4cc4b2; --accent-soft: #173330; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121719; --card: #1b2225; --fg: #e6ecee; --muted: #93a2a8;
  --line: #2c373b; --accent: #4cc4b2; --accent-soft: #173330; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.75rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
.block {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.block-head { display: flex; justify-content: space-between; align-items: baseline; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.diff { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 0.8rem; color: var(--muted); }
.arrow { color: var(--muted); padding-bottom: 10px; font-family: var(--mono); }
select {
  font-family: var(--mono); font-size: 1.1rem; font-variant-numeric: tabular-nums;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; width: 100%; cursor: pointer;
}
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; margin: 0; }
.block.off .row, .block.off .diff, .block.off .note { opacity: 0.35; }
select:disabled { cursor: not-allowed; }
.note { font-size: 0.8rem; color: var(--accent); min-height: 1em; margin: 0; }
.total {
  background: var(--accent-soft); border-radius: 10px; padding: 18px 16px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
}
.total .big { font-family: var(--mono); font-size: 2.2rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
.total .dec { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
</style>

<div class="wrap">
  <div>
    <h1>Time Tally</h1>
    <p class="sub">Pick two time spans. The total adds them up.</p>
  </div>

  <section class="block">
    <div class="block-head"><span class="label">Span 1</span><span class="diff" id="d1">–</span></div>
    <div class="row">
      <div class="field"><label for="a1">From</label><select id="a1"></select></div>
      <span class="arrow">→</span>
      <div class="field"><label for="b1">To</label><select id="b1"></select></div>
    </div>
    <p class="note" id="n1"></p>
  </section>

  <section class="block" id="span2">
    <div class="block-head">
      <label class="toggle" for="on2"><input type="checkbox" id="on2" checked><span class="label">Span 2</span></label>
      <span class="diff" id="d2">–</span>
    </div>
    <div class="row">
      <div class="field"><label for="a2">From</label><select id="a2"></select></div>
      <span class="arrow">→</span>
      <div class="field"><label for="b2">To</label><select id="b2"></select></div>
    </div>
    <p class="note" id="n2"></p>
  </section>

  <section class="total" aria-live="polite">
    <span class="label">Total</span>
    <div style="text-align:right">
      <div class="big" id="tot">0h 00m</div>
      <div class="dec" id="dec">0.00 hours</div>
    </div>
  </section>
</div>

<script>
const STEP = 30; // minutes
const pad = n => String(n).padStart(2, "0");
const defaults = { a1: "09:00", b1: "12:30", a2: "13:00", b2: "17:30" };
const ids = ["a1", "b1", "a2", "b2"];

ids.forEach(id => {
  const sel = document.getElementById(id);
  for (let m = 0; m < 1440; m += STEP) {
    const v = pad(Math.floor(m / 60)) + ":" + pad(m % 60);
    sel.add(new Option(v, m));
  }
  let saved = null;
  try { saved = localStorage.getItem("tt-" + id); } catch (e) {}
  const [h, mm] = defaults[id].split(":").map(Number);
  if (saved !== null && +saved % STEP !== 0) saved = null;
  sel.value = saved ?? String(h * 60 + mm);
  sel.addEventListener("change", () => {
    try { localStorage.setItem("tt-" + id, sel.value); } catch (e) {}
    calc();
  });
});

const fmt = m => Math.floor(m / 60) + "h " + pad(m % 60) + "m";

function span(a, b, n) {
  const s = +document.getElementById(a).value, e = +document.getElementById(b).value;
  let d = e - s;
  document.getElementById(n).textContent = d < 0 ? "Crosses midnight, counted as overnight" : "";
  if (d < 0) d += 1440;
  return d;
}

const on2 = document.getElementById("on2");
try { if (localStorage.getItem("tt-on2") === "0") on2.checked = false; } catch (e) {}
on2.addEventListener("change", () => {
  try { localStorage.setItem("tt-on2", on2.checked ? "1" : "0"); } catch (e) {}
  calc();
});

function calc() {
  const enabled = on2.checked;
  document.getElementById("span2").classList.toggle("off", !enabled);
  document.getElementById("a2").disabled = !enabled;
  document.getElementById("b2").disabled = !enabled;
  const x = span("a1", "b1", "n1");
  const y = enabled ? span("a2", "b2", "n2") : 0;
  document.getElementById("d1").textContent = fmt(x);
  document.getElementById("d2").textContent = enabled ? fmt(y) : "Off";
  document.getElementById("tot").textContent = fmt(x + y);
  document.getElementById("dec").textContent = ((x + y) / 60).toFixed(2) + " hours";
}
calc();
</script>

</body></html>
